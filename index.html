<!DOCTYPE html>
<html>
<head>
    <title>RECEPTOR - PC</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; }
        video { width: 80%; border: 2px solid #e74c3c; border-radius: 10px; background: #000; }
        .id-box { font-size: 24px; color: #f1c40f; margin: 20px; padding: 10px; border: 1px dashed; }
    </style>
</head>
<body>
    <h1>TELA DE RECEPÇÃO (OBS)</h1>
    <div class="id-box">ID DO PC: <span id="meu-id">...</span></div>
    <video id="video-remoto" autoplay playsinline></video>

    <script>
        const peer = new Peer();
        peer.on('open', id => document.getElementById('meu-id').innerText = id);

        // Quando o iPhone ligar para este PC...
        peer.on('call', call => {
            call.answer(); // Atende sem enviar vídeo de volta
            call.on('stream', remoteStream => {
                document.getElementById('video-remoto').srcObject = remoteStream;
            });
        });
    </script>
</body>
</html>
